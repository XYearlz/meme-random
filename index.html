<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duelo Random 1v1 - IA Judge</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="header">
    <h1 class="glitch-title">DUELO RANDOM <span>1v1</span></h1>
    <p class="subtitle">Muestra el objeto más absurdo. La IA elegirá al ganador.</p>
  </div>

  <div class="user-panel">
    <div id="login-section">
      <input type="text" id="usernameInput" placeholder="Tu nombre de usuario...">
      <button onclick="guardarUsuario()">GUARDAR PERFIL</button>
    </div>
    <div id="profile-section" style="display: none;">
      Jugando como: <span id="displayMyName">---</span>
      <button class="btn-change" onclick="cerrarSesion()">Cambiar</button>
    </div>
  </div>

  <div class="control-panel">
    <div id="status" class="status-box">Cargando cámara local...</div>
    <div id="countdown-overlay" class="countdown-overlay">5</div>
    <button id="btnDuelo" onclick="iniciarBusqueda()">⚡ BUSCAR RIVAL Y PELEAR ⚡</button>
  </div>

  <div class="duel-arena">
    <div class="player-card card-player1" id="card1">
      <div class="player-header">
        <span class="badge badge-p1" id="nameP1">JUGADOR 1 (TÚ)</span>
        <span class="score-tag" id="score1">--/100</span>
      </div>
      <div class="video-wrapper">
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
    </div>

    <div class="vs-divider">VS</div>

    <div class="player-card card-player2" id="card2">
      <div class="player-header">
        <span class="badge badge-p2" id="nameP2">JUGADOR 2 (RIVAL)</span>
        <span class="score-tag" id="score2">--/100</span>
      </div>
      <div class="video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>
  </div>

  <div id="result-box" class="result-box">
    <h2 id="winner-title">ESPERANDO DUELO...</h2>
    <div id="ia-explanation">Presiona el botón para conectar con un rival.</div>
  </div>

  <!-- Pantalla Final Game Over -->
  <div id="end-screen" class="end-screen-overlay" style="display: none;">
    <div class="end-screen-card">
      <h1 id="end-status-title" class="end-title">BRUTALIZED</h1>
      <p id="end-status-sub" class="end-sub">BY RIVAL</p>

      <div class="end-scores-container">
        <div class="end-score-box box-you">
          <span class="box-label">YOU</span>
          <span id="end-score-you" class="box-score">3.0</span>
          <span id="end-elo-you" class="box-elo">-21 ELO</span>
        </div>
        <div class="vs-badge">VS</div>
        <div class="end-score-box box-rival">
          <span id="end-label-rival" class="box-label">RIVAL</span>
          <span id="end-score-rival" class="box-score">4.6</span>
          <span id="end-elo-rival" class="box-elo">+19 ELO</span>
        </div>
      </div>

      <div class="end-actions">
        <button class="btn-end btn-find" onclick="actionFindMatch()">FIND NEW MATCH</button>
        <button class="btn-end btn-rematch" onclick="actionRematch()">REMATCH</button>
        <button class="btn-end btn-menu" onclick="actionReturnMenu()">RETURN TO MENU</button>
      </div>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script src="script.js?v=4"></script>
</body>
</html>
