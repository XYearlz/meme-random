<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duelo Random 1v1 - IA Judge</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería PeerJS para conectar 2 cámaras en vivo gratis -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="header">
    <h1 class="glitch-title">DUELO RANDOM <span>1v1</span></h1>
    <p class="subtitle">Muestra el objeto más absurdo. La IA elegirá al ganador.</p>
  </div>

  <div class="control-panel">
    <div id="status" class="status-box">Cargando cámara local...</div>
    <div id="countdown-overlay" class="countdown-hidden">5</div>
    <button id="btnDuelo" onclick="iniciarBusqueda()">⚡ BUSCAR RIVAL Y PELEAR ⚡</button>
  </div>

  <div class="duel-arena">
    <!-- Card Jugador 1 (Tú) -->
    <div class="player-card card-player1" id="card1">
      <div class="player-header">
        <span class="badge badge-p1">JUGADOR 1 (TÚ)</span>
        <span class="score-tag" id="score1">--/100</span>
      </div>
      <div class="video-wrapper">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="scanline"></div>
      </div>
    </div>

    <div class="vs-divider">VS</div>

    <!-- Card Jugador 2 (Rival) -->
    <div class="player-card card-player2" id="card2">
      <div class="player-header">
        <span class="badge badge-p2">JUGADOR 2 (RIVAL)</span>
        <span class="score-tag" id="score2">--/100</span>
      </div>
      <div class="video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="scanline"></div>
      </div>
    </div>
  </div>

  <!-- Modal/Caja de Resultado de la IA -->
  <div id="result-box" class="result-box">
    <h2 id="winner-title">ESPERANDO DUELO...</h2>
    <div id="ia-explanation">Presiona el botón para conectar con un rival o probar el modo de prueba.</div>
  </div>

  <!-- Canvas oculto para capturar las fotos -->
  <canvas id="canvas" style="display:none;"></canvas>

  <script src="script.js"></script>
</body>
</html>
